[workspace]
resolver = "2"
members = [
    "crates/openrich-document",
    "crates/openrich-editor",
    "crates/openrich-render",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package]
name = "openrich-extensions"
description = "Sistem extension bergaya Tiptap, editor headless, dan StarterKit OpenRich"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
openrich-model.workspace = true
openrich-transform.workspace = true
openrich-state.workspace = true
openrich-history.workspace = true
openrich-commands.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde_json.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
openrich-model = { workspace = true, features = ["test-util"] }
openrich-state = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

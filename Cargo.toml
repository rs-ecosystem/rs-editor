[workspace]
resolver = "3"
members = ["crates/*"]
# v1 tetap bisa dibangun sebagai workspace terpisah di legacy/.
exclude = ["legacy"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
openrich-model = { path = "crates/openrich-model" }
openrich-transform = { path = "crates/openrich-transform" }
openrich-state = { path = "crates/openrich-state" }
openrich-history = { path = "crates/openrich-history" }
openrich-text = { path = "crates/openrich-text" }
openrich-commands = { path = "crates/openrich-commands" }
openrich-extensions = { path = "crates/openrich-extensions" }
openrich-theme = { path = "crates/openrich-theme" }
openrich-layout = { path = "crates/openrich-layout" }
openrich-view = { path = "crates/openrich-view" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-segmentation = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

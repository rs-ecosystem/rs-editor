# Kotlin bindings for the Android library (platforms/android/openrich).
# Built by platforms/android/package-native.py, not `boltffi pack`.
[package]
name = "openrich-android"
crate = "openrich_android"
version = "0.1.0"

[targets.apple]
enabled = false

[targets.android]
architectures = ["arm64", "x86_64"]
output = "../../platforms/android/openrich/generated"
min_sdk = 26

[targets.android.kotlin]
package = "dev.openrich.android"
library_name = "openrich_android"
output = "../../platforms/android/openrich/generated/kotlin"

[targets.android.pack]
output = "../../platforms/android/openrich/generated/jniLibs"
